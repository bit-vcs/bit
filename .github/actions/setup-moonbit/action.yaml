name: Setup MoonBit
description: Install the MoonBit toolchain pinned by flake.lock

# The toolchain comes from the flake's `moonbit` package (moonbit-overlay,
# pinned in flake.lock), the same derivation the dev shell and the nix build
# use. To move to a newer MoonBit, update the lock:
#
#   nix flake update moonbit-overlay
#
# Nix runs on the Linux and macOS runners; no job uses this on Windows.

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: ./.github/actions/setup-nix
      with:
        cache-key-prefix: nix-moonbit

    - name: Install MoonBit from flake.lock
      shell: bash
      run: |
        set -euo pipefail
        nix build .#moonbit --out-link "$RUNNER_TEMP/moonbit"
        echo "$RUNNER_TEMP/moonbit/bin" >> "$GITHUB_PATH"

    - name: Report MoonBit version
      shell: bash
      run: moon version --all
