name: Setup MoonBit
description: Install the repository's pinned MoonBit toolchain

inputs:
  version:
    description: MoonBit toolchain version
    required: false
    # Keep this on the toolchain the workspace is verified against: the
    # dependency pins in modules/*/moon.mod (moonbitlang/async 0.22,
    # moonbitlang/x 0.5, bobzhang/toml 0.4) need the 2026-09 compiler.
    default: "0.10.13+cbb11c36f"

runs:
  using: composite
  steps:
    - name: Install MoonBit CLI (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        MOONBIT_INSTALL_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
        echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

    - name: Install MoonBit CLI (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        MOONBIT_INSTALL_VERSION: ${{ inputs.version }}
      run: |
        Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
        irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
        echo "$env:USERPROFILE\.moon\bin" |
          Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Report MoonBit version (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: moon version --all

    - name: Report MoonBit version (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: moon version --all
