name: Setup Nix
description: Install Nix with caching

inputs:
  cache-key-prefix:
    description: >-
      Prefix for the Nix store cache key. Jobs that realise different store
      closures (the full nix build vs. just the MoonBit toolchain) use
      different prefixes so they don't restore each other's caches.
    required: false
    default: nix

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
      with:
        github_access_token: ${{ github.token }}

    - name: Cache Nix store
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        primary-key: ${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
        restore-prefixes-first-match: ${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ runner.arch }}-
